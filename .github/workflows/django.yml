name: Django CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11.0]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        python manage.py test

      env:
        DJANGO_SECRET_KEY: "django-insecure-c0y7^zo53cwo$0!4(7ife!=%$46wk=6*)g$rgivz41uncm%z@)"
        DEBUG: 1
        MONGO_DB_PSW_SECRET_KEY: ""
        USE_MYSQL: False
        MYSQL_DB_NAME: "leave_db"
        MYSQL_DB_USER: "root"
        MYSQL_DB_PASSWORD: "password"
        MYSQL_DB_HOST: "127.0.0.1"
        MYSQL_DB_PORT: "3306"
        SECRET_KEY: ""
        EMAIL_HOST: "smtp.office365.com"
        EMAIL_PORT: 587
        EMAIL_HOST_USER: ""
        DEFAULT_FROM_EMAIL: ""
        EMAIL_HOST_PASSWORD: ""
        EMAIL_USE_TLS: True
        DEFAULT_RECIPIENT: ""
